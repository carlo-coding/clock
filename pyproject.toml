[project]
name = "clock"
version = "0.1.0"
description = "Daily day-ahead forecasts for European power, scored against the TSO's own forecast and timestamped with OpenTimestamps."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "tzdata>=2024.1",
    "opentimestamps-client>=0.7.1",
]

[project.scripts]
tick = "tick.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
