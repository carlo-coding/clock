# Rebuilds and deploys the page when the code or the record is pushed by a
# person. The scheduled jobs deploy on their own (pushes made with the
# Actions token do not trigger other workflows).

name: pages

on:
  push:
    branches: [main]
    paths: ["src/**", "data/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run tick site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
